#config.yml
source:
  type: 'database'
  transformation : ['Y',"sql"]
  table : ' [dbo].[cust_data_1]'
  cred_lookup : 'azure_server'
  exclude_cols : ['batch_id']

target:
  type: 'database'
  transformation: [ 'Y',"sql" ]
  table: ' [dbo].[cust_data_2]'
  cred_lookup: 'azure_server'
  exclude_cols: [ 'batch_id' ]


validations:
  count_check:
    key_columns: ["customer_id"]
  duplicate_check:
    key_columns: ["customer_id","name","email","phone"]
  null_check:
    null_columns: ["customer_id","name", "email", "phone"]
    num_records: 100
  uniqueness_check:
    unique_columns: ["phone","name"]
  data_compare_check:
    key_column: ["customer_id"]
    validate_columns: ["na"]
    num_records: 100
  dq_check:
    name_check: "customer_name"
    check_range: [10,99]
